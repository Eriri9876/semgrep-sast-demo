rules:
  - id: general-unused-variable
    patterns:
      - pattern: |
          $VAR = $VALUE
          ...
          $FUNC(...)
    languages: [python]
    message: "检测到疑似未被使用的变量赋值（死代码），建议清理无用变量以提升可读性与可维护性。"
    severity: INFO
    metadata:
      cwe: "CWE-563"
      owasp: "A06:2021"
